<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Fonctionnelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculatrice">
        <input type="text" id="ecran" disabled>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button style="background-color: yellow; color: black;">+</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button style="background-color: yellow; color: black;">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button style="background-color: yellow; color: black;">*</button>
            <button>.</button>
            <button>0</button>
            <button id="delete">⌫</button>
            <button style="background-color: yellow; color: black;">/</button>
            <button id="clear" class="large">C</button>
            <button id="egal">=</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
